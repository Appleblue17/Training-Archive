name: Crawler Scheduled

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes: task A (scheduled contests + reviews)

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment: archive-crawler
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Setup Chrome 114 with browser-actions/setup-chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: 114

      - name: Show chromium-browser and chromedriver version after setup
        run: |
          echo ${{ steps.setup-chrome.outputs.chrome-path }}
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pandoc 3.6.3
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.6.3"

      - name: Check pandoc version
        run: pandoc --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      - name: Ensure chromedriver is executable
        run: chmod +x crawler/chromedriver_linux64/chromedriver

      - name: "Run scheduled task (task A: fetch contests + sync submissions + reviews)"
        id: crawl
        run: python3 crawler/scheduled_task.py
        env:
          PYTHONUNBUFFERED: "1"
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          QOJ_USERNAME: ${{ secrets.QOJ_USERNAME }}
          QOJ_PASSWORD: ${{ secrets.QOJ_PASSWORD }}
          HDU_USERNAME: ${{ secrets.HDU_USERNAME }}
          HDU_PASSWORD: ${{ secrets.HDU_PASSWORD }}
          NEWCODER_COOKIE_NOWCODERUID: ${{ secrets.NEWCODER_COOKIE_NOWCODERUID }}
          NEWCODER_COOKIE_T: ${{ secrets.NEWCODER_COOKIE_T }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Clean log files
        run: python3 crawler/clean-log.py

      - name: "Add, commit and push changes"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # deploy 分支使用专用 gitignore：contests/ 与爬虫增量状态纳入版本控制，
          # 保证增量同步跨运行生效，手动上传代码也能被正常跟踪。
          cp .gitignore.deploy .gitignore
          git add .gitignore crawler contests
          git reset HEAD crawler/chromedriver_linux64/chromedriver 2>/dev/null || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^contests/'; then
            git commit -m "[auto] [contests-changed] Update contest and submission data"
          else
            # 只有爬虫状态变化（如 last-update 推进）时也提交，但不带标记，
            # 避免触发 deploy。
            git commit -m "[auto] Update crawler state"
          fi
          git push
